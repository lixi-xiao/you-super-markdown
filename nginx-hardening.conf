# You Super Markdown —— Nginx 站点安全加固片段（由更新器管理，请勿手工修改）
#
# 说明：
#   本文件是「本项目自有」的 server 块 include 片段，由 ysm-admin apply-update 随包同步到系统
#   （/etc/nginx/snippets/ysm-hardening.conf），并以 `include` 方式被站点 server 块引用。
#   更新器在同步后会执行 `nginx -t` 校验：不通过则回滚本片段并中止更新（失败封闭）。
#   仅包含本项目自有 server 块所需的 location 规则，不涉及任何第三方配置。
#
# 作用：
#   1) 关闭 nginx 版本号暴露（Server 响应头不再带版本）
#   2) 字体等敏感资源仅经受控端点提供，禁止直读 /data/fonts/ 下的文件
#      （否则会命中 `location ~* \.(...|ttf|...)$` 静态规则被公开下载）
#   3) 文章源文件禁止直读 /data/articles/：目录内含草稿/定时发布文章（带 status/author_id 元数据），
#      直读会绕过发布状态过滤。应用层按 ?action=read / ?file= 经 PHP 读文件不受影响（非 HTTP 静态直读）。
#   4) 信息暴露面收敛：更新元数据 / 项目文档 / 音乐平台内部处理器不提供 HTTP 直读
#      （/version.json、/README.md、/HELP.md 非前台资源；/music/*.php 仅由 music.php 经文件系统 require）。

server_tokens off;

location ^~ /data/fonts/ {
    deny all;
    return 403;
}

# v5.4.1：文章目录整体拒绝直读（防绕过发布状态过滤读取草稿/定时文章）
location ^~ /data/articles/ {
    deny all;
    return 403;
}

# v5.4.1：音乐平台内部处理器禁止直读（前台仅经 music.php 调用）
location ^~ /music/ {
    deny all;
    return 403;
}

# v5.4.1：信息暴露面收敛（更新元数据 / 项目文档直读）
location = /version.json {
    deny all;
    return 403;
}

location = /README.md {
    deny all;
    return 403;
}

location = /HELP.md {
    deny all;
    return 403;
}
