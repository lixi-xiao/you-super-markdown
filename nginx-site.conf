server {
    listen 80;
    server_name youmarkdown.example.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_tokens off;
    server_name youmarkdown.example.com;

    ssl_certificate     /etc/nginx/ssl/ym.crt;
    ssl_certificate_key /etc/nginx/ssl/ym.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    root /var/www/you-markdown;
    index index.php index.html;

    # 安全响应头
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 禁止访问数据目录
    location ~ ^/data/.*\.json$ {
        deny all;
        return 403;
    }

    # 禁止访问脚本/配置/备份等敏感文件
    location ~* \.(sh|py|conf|bak|sql|log)$ {
        deny all;
        return 403;
    }

    # 禁止访问 CLI/安装/调试文件
    location ~ ^/(ym-admin|ym-install\.sh|ym-guard\.py|test\.php|debug\.php|entry_debug\.php|entry_fixed\.php)$ {
        deny all;
        return 403;
    }

    # ACME 验证放行（certbot webroot 续期）
    location ^~ /.well-known/ {
        allow all;
    }

    # 禁止下载应用配置（泄露 repo/hfish 信息）
    location = /app-config.json {
        deny all;
        return 403;
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        return 403;
    }

    # OTP 动态入口 - 直接传递给 PHP 避免内部重定向改变 REQUEST_URI
    location /admin/entry/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/admin/entry.php;
        fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
    }

    # 自定义入口路径 fallback（支持站长/写作者自定义路径）
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # PHP 处理
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    # 静态文件缓存
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}